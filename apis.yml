aid: be-biopharma
name: Be Biopharma
description: 'Be Biopharma (Be Bio) is a Cambridge, Massachusetts clinical-stage biotechnology
  company founded in October 2020 by Longwood Fund together with B cell engineering
  researchers David Rawlings, M.D. and Richard James, Ph.D. of Seattle Children''s
  Research Institute. The company develops engineered B Cell Medicines (BCMs) — a
  patient''s own B cells engineered to produce a therapeutic protein — for genetic
  disease, cancer and other serious conditions. Its lead candidate, BE-101, inserted
  a functional Factor IX gene into primary human B cells for hemophilia B and held
  FDA Orphan Drug and Fast Track designations; a second program, BE-102, targeted
  hypophosphatasia. The company raised $82M in October 2024 and $92M in a January
  2025 Series C, dosed the first participant in the Phase 1/2 BeCoMe-9 trial in July
  2025, and terminated that trial in June 2026 for stated strategic business reasons.
  Be Biopharma is a therapeutics developer, not a software company: it has never
  published a developer program, API, SDK or machine-readable contract.'
